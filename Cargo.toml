[package]
name = "neovim-ctrl"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
authors = ["Daniel Mueller <deso@posteo.net>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/d-e-s-o/neovim-ctrl"
repository = "https://github.com/d-e-s-o/neovim-ctrl.git"
readme = "README.md"
categories = [
  "command-line-utilities",
  "text-editors",
  "development-tools",
  "os::unix-apis",
]
keywords = ["neovim", "tmux", "linux", "proc", "procfs"]
description = """
A program to find and interact with a Neovim instance running in a
particular terminal.
"""

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
incremental = false
panic = "abort"

[[bin]]
name = "nvim-ctrl"
path = "src/main.rs"

[dependencies.libc]
version = "0.2"

[dependencies.neovim-lib]
version = "0.6"
git = "https://github.com/d-e-s-o/neovim-lib"
rev = "101cb1a7dd728a8ea44985ffca637f0d368039cf"

[lints.rust]
deprecated_safe = "warn"
future_incompatible = "warn"
keyword_idents = "warn"
let_underscore = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused = "warn"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
diverging_sub_expression = "allow"
let_and_return = "allow"
let_unit_value = "allow"
module_inception = "allow"
type_complexity = "allow"
absolute_paths = "warn"
allow_attributes = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
doc_markdown = "warn"
join_absolute_paths = "warn"
large_enum_variant = "warn"
redundant_closure_for_method_calls = "warn"
unchecked_duration_subtraction = "warn"
uninlined_format_args = "warn"
wildcard_imports = "warn"
